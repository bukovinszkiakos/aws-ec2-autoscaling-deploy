name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Deployment creates live AWS resources and will incur charges. Check to confirm.'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-demo-environment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment
        run: |
          if [[ "${{ inputs.confirm_deploy }}" != 'true' ]]; then
            echo "::error::Deployment not confirmed. Select the confirm_deploy checkbox when running this workflow manually."
            exit 1
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - id: image-check
        name: Check whether image already exists
        run: |
          if aws ecr describe-images \
              --repository-name ${{ vars.ECR_REPOSITORY }} \
              --image-ids imageTag=${{ github.sha }} \
              --region ${{ vars.AWS_REGION }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.image-check.outputs.exists != 'true'
        run: docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} app/BeaconApi

      - name: Scan image
        if: steps.image-check.outputs.exists != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        if: steps.image-check.outputs.exists != 'true'
        run: docker push ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.11"
          terraform_wrapper: false

      - run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=beacon/infra.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - run: terraform -chdir=terraform apply -auto-approve -input=false -var image_tag=${{ github.sha }}

      - name: Health check and publish URL
        run: |
          APP_URL=$(terraform -chdir=terraform output -raw app_url)
          DEADLINE=$(( $(date +%s) + 600 ))
          until curl -fsS "$APP_URL/health" > /dev/null 2>&1; do
            if (( $(date +%s) >= DEADLINE )); then
              echo "Health check timed out after 600s" >&2
              exit 1
            fi
            echo "Waiting for $APP_URL/health ..."
            sleep 15
          done
          echo "Health check passed: $APP_URL"
          echo "App URL: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
