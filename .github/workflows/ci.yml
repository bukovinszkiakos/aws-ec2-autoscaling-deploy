name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore app/BeaconApi.slnx

      - run: dotnet build app/BeaconApi.slnx --no-restore -c Release

      - run: dotnet test app/BeaconApi.slnx --no-build -c Release

      - run: docker build -t beacon-api:ci app/BeaconApi

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beacon-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
