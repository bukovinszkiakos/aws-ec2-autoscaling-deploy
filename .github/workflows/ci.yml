name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore app/BeaconApi.slnx

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release

      - run: docker build -t beacon-api:ci app/BeaconApi
