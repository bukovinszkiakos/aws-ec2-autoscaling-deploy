name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.11"

      - run: terraform fmt -check -recursive

      - run: terraform -chdir=bootstrap init -backend=false
      - run: terraform -chdir=bootstrap validate

      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: terraform-checks
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.11"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=beacon/infra.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - run: terraform -chdir=terraform plan -lock=false -input=false -var image_tag=${{ github.sha }}

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore app/BeaconApi.slnx

      - run: dotnet build app/BeaconApi.slnx --no-restore -c Release

      - run: dotnet test app/BeaconApi.slnx --no-build -c Release

      - run: docker build -t beacon-api:ci app/BeaconApi

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beacon-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
